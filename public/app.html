<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CxSSH — Web SSH Manager</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
</head>
<body>
  <div class="bg-mesh"></div>

  <div class="spa-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">⚡</div>
        <span class="brand-name" style="font-size: 20px; font-weight: 700;">CxSSH</span>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-label">Connection</div>
        <div class="nav-item active" data-view="dashboard">🖥️ Servers</div>
        <div class="nav-item" data-view="terminal">⌨️ Workspaces <span id="tabCountBadge" class="badge badge-accent" style="margin-left: auto; display:none;">0</span></div>
        
        <div class="sidebar-label" style="margin-top: 24px;">Security</div>
        <div class="nav-item" data-view="keys">🔑 SSH Keys</div>
        <div class="nav-item" data-view="proxies">🌐 Proxies</div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip" style="margin-bottom: 12px; width: 100%;">
          <div class="user-avatar" id="userAvatar">A</div>
          <span id="userNameDisplay">admin</span>
        </div>
        <button class="btn btn-ghost btn-sm w-full" id="logoutBtn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-area">
      <!-- Servers View -->
      <section id="view-dashboard" class="view-container active">
        <div class="page-header">
          <div>
            <h1 class="page-title">Remote Servers</h1>
            <p class="page-subtitle" id="serverCountLabel">Connect and manage your infrastructure</p>
          </div>
          <div class="flex gap-3">
            <input class="form-input" type="search" id="serverSearch" placeholder="Filter servers..." style="width: 240px;" />
            <button class="btn btn-primary" id="addServerBtn">＋ New Server</button>
          </div>
        </div>
        <div class="server-grid mt-4" id="serverGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;"></div>
      </section>

      <!-- Workspace View (Window Manager) -->
      <section id="view-terminal" class="view-container terminal-view" style="display: flex; flex-direction: column; padding: 0;">
        <div class="terminal-workspace" id="termWorkspace">
          <!-- Terminal windows will be injected here -->
        </div>
      </section>

      <!-- SSH Keys View -->
      <section id="view-keys" class="view-container">
        <div class="page-header">
          <h1 class="page-title">SSH Identities</h1>
          <button class="btn btn-primary" id="addKeyBtn">＋ New Identity</button>
        </div>
        <div class="keys-grid mt-4" id="keysGrid"></div>
      </section>

      <!-- Proxies View -->
      <section id="view-proxies" class="view-container">
        <div class="page-header">
          <h1 class="page-title">Network Proxies</h1>
          <button class="btn btn-primary" id="addProxyBtn">＋ New Proxy</button>
        </div>
        <div class="data-grid mt-4" id="proxyGrid"></div>
      </section>
    </main>
  </div>

  <!-- Modals -->
  <!-- Server Modal -->
  <div class="modal-overlay" id="serverModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="serverModalTitle">Server Profile</h2>
        <button class="modal-close" onclick="closeModal('serverModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Display Name *</label>
          <input class="form-input" type="text" id="sName" placeholder="Production Web 01" />
        </div>
        <div class="flex gap-3">
          <div class="form-group flex-1">
            <label class="form-label">Hostname / IP *</label>
            <input class="form-input font-mono" type="text" id="sHost" placeholder="10.0.0.1" />
          </div>
          <div class="form-group" style="width: 100px;">
            <label class="form-label">Port</label>
            <input class="form-input font-mono" type="number" id="sPort" value="22" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Username *</label>
          <input class="form-input font-mono" type="text" id="sUsername" placeholder="root" />
        </div>
        <div class="form-group">
          <label class="form-label">Authentication Method</label>
          <select class="form-select" id="sAuthType">
            <option value="password">Password</option>
            <option value="managed_key">Managed Identity (Key)</option>
            <option value="key">Direct Private Key</option>
          </select>
        </div>
        <div id="auth-password" class="auth-fields">
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="sPassword" />
          </div>
        </div>
        <div id="auth-managed_key" class="auth-fields" style="display:none">
          <div class="form-group">
            <label class="form-label">Choose Identity</label>
            <select class="form-select" id="sKeyId"></select>
          </div>
        </div>
        <div id="auth-key" class="auth-fields" style="display:none">
          <div class="form-group">
            <label class="form-label">Private Key Content (PEM)</label>
            <textarea class="form-textarea font-mono" id="sPrivateKey" style="height: 120px;"></textarea>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Proxy Tunnel</label>
          <select class="form-select" id="sProxyId"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Card Accent Color</label>
          <div class="color-picker" id="serverColorPicker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="testServerBtn">🔌 Test Connection</button>
        <button class="btn btn-primary" id="saveServerBtn" style="padding-left: 32px; padding-right: 32px;">Save</button>
      </div>
    </div>
  </div>

  <!-- Key Modal -->
  <div class="modal-overlay" id="keyModal">
    <div class="modal" style="max-width:450px">
      <div class="modal-header">
        <h2 class="modal-title">SSH Identity</h2>
        <button class="modal-close" onclick="closeModal('keyModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="dash-nav" style="margin-bottom: 12px;">
          <button class="dash-nav-btn active" id="keyGenTab">Generate New</button>
          <button class="dash-nav-btn" id="keyImportTab">Import Existing</button>
        </div>
        <div class="form-group">
          <label class="form-label">Identity Name *</label>
          <input class="form-input" type="text" id="kName" placeholder="My Secure Key" />
        </div>
        <div id="keyGenFields">
          <div class="form-group">
            <label class="form-label">Encryption Algorithm</label>
            <select class="form-select" id="kType">
              <option value="ed25519">Ed25519 (Recommended)</option>
              <option value="rsa">RSA 4096-bit</option>
            </select>
          </div>
        </div>
        <div id="keyImportFields" style="display:none">
          <div class="form-group">
            <label class="form-label">Private Key (PEM format)</label>
            <textarea class="form-textarea font-mono" id="kPrivate" style="height: 150px;"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveKeyBtn">Save Identity</button>
      </div>
    </div>
  </div>

  <!-- Proxy Modal -->
  <div class="modal-overlay" id="proxyModal">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <h2 class="modal-title" id="proxyModalTitle">Network Proxy</h2>
        <button class="modal-close" onclick="closeModal('proxyModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Profile Name *</label>
          <input class="form-input" type="text" id="pName" placeholder="Jump Server A" />
        </div>
        <div class="form-group">
          <label class="form-label">Protocol</label>
          <select class="form-select" id="pType">
            <option value="socks5">SOCKS5</option>
            <option value="http">HTTP CONNECT</option>
          </select>
        </div>
        <div class="flex gap-3">
          <div class="form-group flex-1">
            <label class="form-label">Host Address *</label>
            <input class="form-input font-mono" type="text" id="pHost" placeholder="proxy.local" />
          </div>
          <div class="form-group" style="width: 100px;">
            <label class="form-label">Port *</label>
            <input class="form-input font-mono" type="number" id="pPort" value="1080" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Auth Username</label>
          <input class="form-input" type="text" id="pUsername" placeholder="Optional" />
        </div>
        <div class="form-group">
          <label class="form-label">Auth Password</label>
          <input class="form-input" type="password" id="pPassword" placeholder="Optional" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveProxyBtn">Save Proxy Profile</button>
      </div>
    </div>
  </div>

  <!-- New Session Server Picker Modal -->
  <div class="modal-overlay" id="serverPickerModal">
    <div class="modal" style="max-width:450px">
      <div class="modal-header">
        <h2 class="modal-title">Open Terminal</h2>
        <button class="modal-close" onclick="closeModal('serverPickerModal')">✕</button>
      </div>
      <div class="modal-body">
        <input class="form-input" type="search" id="pickerSearch" placeholder="Search servers to connect..." style="margin-bottom:12px" />
        <div class="server-picker-list" id="pickerList"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
